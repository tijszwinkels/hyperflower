<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hyperflower</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="main.js"></script>
</head>
<body>
  <canvas aria-label="Animated psychedelic rainbow flower"></canvas>
  <header>
    <h1>Hyperflower</h1>
    <div class="controls">
      <button id="pause" type="button">Pause</button>
      <label>Speed <input id="speed" type="range" min="0.1" max="3" step="0.1" value="1"><output id="speed-value">1×</output></label>
      <button id="fullscreen" type="button">Fullscreen</button>
    </div>
    <p id="status" role="status">Loading shader…</p>
  </header>
</body>
</html>
